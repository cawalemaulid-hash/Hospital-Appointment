<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment - Garissa Hospital</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- HEADER -->
    <header>
        
         <h1>Garissa Hospital</h1>
        <!-- NAVIGATION -->
        <nav>
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="doctors.html">Doctors</a>
            <a href="appointment.html" class="active">Appointment</a>
        </nav>
    </header>

<section class="appointment-section">

    <div class="form-heading">
        <h2>Book Your Appointment</h2>
        <p>Please fill in the details below to request your appointment.</p>
    </div>

    <form id="appointmentForm">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="e.g. Ahmed Hassan"
                autocomplete="name"
            >
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="e.g. 0712345678"
                autocomplete="tel"
            >
        </div>

        <div class="form-group">
            <label for="department">Department</label>
            <input
                type="text"
                id="department"
                name="department"
                list="departmentOptions"
                placeholder="Choose or type a department"
                autocomplete="organization"
            >

            <datalist id="departmentOptions">
                <option value="General Medicine"></option>
                <option value="Pediatrics"></option>
                <option value="Maternal and Child Health"></option>
                <option value="Dental Services"></option>
            </datalist>
        </div>

        <div class="form-group">
            <label for="doctor">Doctor</label>
            <input
                type="text"
                id="doctor"
                name="doctor"
                list="doctorOptions"
                placeholder="Choose or type a doctor"
                autocomplete="name"
            >

            <datalist id="doctorOptions">
                <option value="Dr. Ahmed Hassan"></option>
                <option value="Dr. Fatuma Ali"></option>
                <option value="Dr. Maryam Yusuf"></option>
                <option value="Dr. Ibrahim Noor"></option>
            </datalist>
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="date">Appointment Date</label>
                <input type="date" id="date">
            </div>

            <div class="form-group">
                <label for="time">Appointment Time</label>
                <input type="time" id="time">
            </div>

        </div>

        <div class="form-group">
            <label for="reason">Reason for Visit</label>
            <textarea
                id="reason"
                placeholder="Briefly describe the reason for your visit"
            ></textarea>
        </div>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</section>


    
<section class="back">
        <h2 >My Appointments</h2>

        <div id="appointments"></div>

    </section>
    <footer>
        <p>&copy; 2024 Garissa Hospital. All rights reserved.</p>
    </footer>

    <!-- JAVASCRIPT -->

    <script src="appointment.js"></script>
</body>
</html>
